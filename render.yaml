# Render(https://render.com) 배포 설정 파일입니다.
# GitHub에 이 폴더를 올린 뒤, Render에서 "New +" > "Blueprint"로 이 저장소를 연결하면
# 이 파일을 읽어서 자동으로 서비스를 만들어줍니다. (수동으로 "Web Service"를 만들어도 됩니다.)
services:
  - type: web
    name: sis-guide-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ALLOW_ALL
        value: "true"
